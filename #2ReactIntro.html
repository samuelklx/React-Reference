<!-- 
# React Intro Example
React apps are made out of 'components.' A component is a piece of the UI (user interface) that has its own logic and appearance. 
A component can be as small as a button, or as large as an entire page. 
Components are able to be reused throughout the app, allowing for easier to update code and perform maintenance.

In React, components are usually written as JavaScript functions or classes. 
They can accept inputs called "props" (short for properties) and return a React element that describes how a section of the UI should look. 
React components are JavaScript functions that return JSX markup. 
This markup is typically written in a syntax called JSX, which allows you to write HTML-like code in your JavaScript files. 
When the component is rendered, React will create a corresponding DOM element based on the returned markup.

In this example, a React component is created that displays a heading with the text "Develop. Preview. Ship." using the React library. It uses the ReactDOM library to render a component to the DOM.

Check out the official React documentation for further info on how this works: https://reactjs.org/docs/getting-started.html 

-->

<html>

<body>
    <div id="app"></div>
    <!-- The React library is included via a CDN (Content Delivery Network) link. This allows us to use React in our HTML file without having to install it locally. -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- The ReactDOM library is also included via a CDN link. This library provides methods for interacting with the DOM and rendering React components to the page. -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel is a JavaScript compiler that allows the use of the latest JavaScript features, including JSX syntax, in the code. It is included via a CDN link so React components can be written using JSX. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Now the React and ReactDOM libraries will create and render our React components. -->

    <!-- This was the original javascript that was included in #1TheDOMExample. 
    This is what is being replaced by our new react component -->
    <!-- 
    <script type=""text/javascript">
        const app = document.getElementById('app');
        const header = document.createElement('h1');
        const text = 'Develop. Preview. Ship.';
        const headerContent = document.createTextNode(text);
            
        header.appendChild(headerContent); 
        app.appendChild(header); 
    </script>
    -->

    <!-- This is the new script. Note that the type is now JSX, rather than JavaScript. -->
    <!-- JSX is a syntax extension for JavaScript that allows for description of the UI in a familiar HTML-like syntax.-->
    <script type="text/jsx">
        const app = document.getElementById('app');
        const root = ReactDOM.createRoot(app);         // This line creates a root for the React app. This will be the entry point for our React component.
        root.render(<h1>Develop. Preview. Ship.</h1>); 
    </script>

</body>

</html>
